[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honeypot-aas-backend"
version = "0.1.0"
description = "Cybersecurity Deception Network for SMBs — Backend API & Services"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",

    # Kafka
    "aiokafka>=0.10.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Data validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",

    # GeoIP enrichment
    "geoip2>=4.8.0",

    # HTTP clients
    "httpx>=0.27.0",

    # AI / Embeddings
    "anthropic>=0.18.0",
    "openai>=1.12.0",

    # AWS
    "boto3>=1.34.0",

    # WebSockets
    "websockets>=12.0",

    # Utilities
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
